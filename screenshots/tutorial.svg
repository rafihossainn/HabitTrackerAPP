<svg width="360" height="720" viewBox="0 0 360 720" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF5C7A"/>
      <stop offset="100%" stop-color="#C0394F"/>
    </linearGradient>
  </defs>

  <rect width="360" height="720" fill="#13131F"/>

  <rect width="360" height="56" fill="#1C1C2A"/>
  <text x="20" y="36" fill="white" font-size="14">☰</text>
  <text x="48" y="36" fill="white" font-size="15" font-weight="600">Tutorial</text>

  <!-- Hero -->
  <rect x="0" y="56" width="360" height="100" fill="url(#hero)"/>
  <text x="24" y="100" fill="white" font-size="22" font-weight="700">▶️ Tutorial</text>
  <text x="24" y="124" fill="#FFD0D8" font-size="12">Learn how to track your habits</text>

  <text x="24" y="184" fill="#7A7A8E" font-size="10" letter-spacing="2">WATCH THE OVERVIEW</text>

  <!-- Video player -->
  <rect x="20" y="200" width="320" height="180" rx="18" fill="#000"/>
  <circle cx="180" cy="290" r="38" fill="#FF0000" opacity="0.95"/>
  <polygon points="170,275 170,305 198,290" fill="white"/>
  <text x="180" y="358" fill="#7A7A8E" font-size="11" text-anchor="middle">YouTube tutorial video</text>

  <text x="24" y="408" fill="#7A7A8E" font-size="10" letter-spacing="2">HOW TO USE THE APP</text>

  <!-- Step 1 -->
  <rect x="20" y="424" width="320" height="64" rx="16" fill="#252537"/>
  <rect x="36" y="436" width="40" height="40" rx="12" fill="#7C5CFF"/>
  <text x="56" y="463" fill="white" font-size="18" font-weight="700" text-anchor="middle">1</text>
  <text x="88" y="452" fill="white" font-size="13" font-weight="700">Log your habits daily</text>
  <text x="88" y="470" fill="#B4B4C8" font-size="11">Fill name, duration, date, type</text>

  <!-- Step 2 -->
  <rect x="20" y="500" width="320" height="64" rx="16" fill="#252537"/>
  <rect x="36" y="512" width="40" height="40" rx="12" fill="#00D9A3"/>
  <text x="56" y="539" fill="#13131F" font-size="18" font-weight="700" text-anchor="middle">2</text>
  <text x="88" y="528" fill="white" font-size="13" font-weight="700">Check your Progress ring</text>
  <text x="88" y="546" fill="#B4B4C8" font-size="11">The animated ring fills as you log</text>

  <!-- Step 3 -->
  <rect x="20" y="576" width="320" height="64" rx="16" fill="#252537"/>
  <rect x="36" y="588" width="40" height="40" rx="12" fill="#FFB547"/>
  <text x="56" y="615" fill="#13131F" font-size="18" font-weight="700" text-anchor="middle">3</text>
  <text x="88" y="604" fill="white" font-size="13" font-weight="700">Browse your History</text>
  <text x="88" y="622" fill="#B4B4C8" font-size="11">Color-coded entries</text>

  <!-- Step 4 -->
  <rect x="20" y="652" width="320" height="64" rx="16" fill="#252537"/>
  <rect x="36" y="664" width="40" height="40" rx="12" fill="#FF5C7A"/>
  <text x="56" y="691" fill="white" font-size="18" font-weight="700" text-anchor="middle">4</text>
  <text x="88" y="680" fill="white" font-size="13" font-weight="700">Get Insights on bad habits</text>
  <text x="88" y="698" fill="#B4B4C8" font-size="11">Personalised tips and steps</text>
</svg>
