  <rect x="0" y="56" width="360" height="100" fill="url(#hero)"/>
  <text x="24" y="100" fill="white" font-size="22" font-weight="700">📋 Habit History</text>
  <text x="24" y="124" fill="#E0D8FF" font-size="12">All your logged habits</text>

