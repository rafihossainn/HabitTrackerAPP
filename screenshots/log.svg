<svg width="360" height="720" viewBox="0 0 360 720" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C5CFF"/>
      <stop offset="100%" stop-color="#4A2FD4"/>
    </linearGradient>
  </defs>

  <rect width="360" height="720" fill="#13131F"/>

  <rect width="360" height="56" fill="#1C1C2A"/>
  <text x="20" y="36" fill="white" font-size="14">☰</text>
  <text x="48" y="36" fill="white" font-size="15" font-weight="600">Log Habit</text>

  <!-- Hero -->
  <rect x="0" y="56" width="360" height="100" fill="url(#hero)"/>
  <text x="24" y="100" fill="white" font-size="22" font-weight="700">✏️ Log a Habit</text>
  <text x="24" y="124" fill="#E0D8FF" font-size="12">Saved to local SQLite database</text>

  <!-- Habit Name -->
  <rect x="20" y="178" width="320" height="64" rx="16" fill="#252537"/>
  <text x="36" y="200" fill="#7A7A8E" font-size="9" letter-spacing="2">HABIT NAME</text>
  <text x="36" y="226" fill="white" font-size="15">Morning run</text>

  <!-- Duration -->
  <rect x="20" y="254" width="320" height="64" rx="16" fill="#252537"/>
  <text x="36" y="276" fill="#7A7A8E" font-size="9" letter-spacing="2">DURATION (MINUTES)</text>
  <text x="36" y="302" fill="white" font-size="15">30</text>

  <!-- Date -->
  <rect x="20" y="330" width="320" height="64" rx="16" fill="#252537"/>
  <text x="36" y="352" fill="#7A7A8E" font-size="9" letter-spacing="2">DATE</text>
  <text x="36" y="378" fill="white" font-size="15">May 3, 2026</text>

  <!-- Category -->
  <rect x="20" y="406" width="320" height="64" rx="16" fill="#252537"/>
  <text x="36" y="428" fill="#7A7A8E" font-size="9" letter-spacing="2">CATEGORY</text>
  <text x="36" y="454" fill="white" font-size="15">Exercise</text>

  <!-- Type label -->
  <text x="24" y="494" fill="#7A7A8E" font-size="10" letter-spacing="2">HABIT TYPE</text>

  <!-- Good toggle (selected) -->
  <rect x="20" y="504" width="154" height="80" rx="16" fill="#1A3D35" stroke="#00D9A3" stroke-width="2"/>
  <text x="97" y="530" font-size="22" text-anchor="middle">✅</text>
  <text x="97" y="558" fill="#00D9A3" font-size="13" font-weight="700" text-anchor="middle">Good Habit</text>
  <text x="97" y="574" fill="#7A7A8E" font-size="10" text-anchor="middle">Something healthy</text>

  <!-- Bad toggle -->
  <rect x="186" y="504" width="154" height="80" rx="16" fill="#252537" stroke="#2F2F44" stroke-width="2"/>
  <text x="263" y="530" font-size="22" text-anchor="middle">⚠️</text>
  <text x="263" y="558" fill="#FF5C7A" font-size="13" font-weight="700" text-anchor="middle">Bad Habit</text>
  <text x="263" y="574" fill="#7A7A8E" font-size="10" text-anchor="middle">Something to fix</text>

  <!-- Save button -->
  <rect x="20" y="608" width="320" height="52" rx="16" fill="#7C5CFF"/>
  <text x="180" y="640" fill="white" font-size="15" font-weight="700" text-anchor="middle">Save Habit</text>
</svg>
